# VendorCheck policy. Change thresholds and accepted evidence here; no code change needed.

# Minimum similarity (0-100) between names for them to count as the same company.
name_match_threshold: 92

# Minimum reading confidence (50-100). A GSTIN, PAN, CIN, account number or IFSC read from a scan or photo below this is not trusted:
# the vendor is asked to confirm it. Typed PDFs are read at 100%.
read_confidence: 80

# false = approve a renamed company with an explanation when the evidence shows the rename;
# true = a procurement person must confirm every rename.
rename_requires_person: false

# Which kinds of evidence can satisfy each approval requirement.
# live = a registry answered now; assisted = a person checked the official site (a second person approves);
# document = read from an uploaded file; derived_from_gst = taken from the GST registry record.
requirements:
  gst_registration: [live, assisted]
  pan_identity:     [live, assisted, derived_from_gst]
  bank_account:     [live, assisted]
  company_status:   [live, assisted, document]   # document-only or none => approve with a re-check condition
  udyam:            [live, assisted]
  tax_registration: [live, assisted]             # non-Indian vendors: a person checks the official register

# Days until a condition must be re-checked / the vendor record is re-verified.
recheck_days:
  company_status: 30
  advisory: 90
reverify_days: 365

# Payment terms for micro and small enterprises, in days.
msme_payment_terms_days: 45

# How many months of GST filings may be missing before it is flagged.
filing_gap_months: 2

# Required-documents checklist.
# always = every submission must carry the documents;
# if_uploaded = enforced once the upload contains a vendor pack (registration form, PAN, GST, bank, address, Udyam or tax document);
# off = information only.
require_documents: if_uploaded

# The vendor must be categorised (goods/services, expense category, department owner) and the payment terms
# configured in the system must equal the negotiated terms exactly, before approval.
require_commercial_setup: true

# Blocklist (uppercase PANs, plain account numbers). Matches are rejected outright.
blocklist:
  pans: ["ABCDE1234F"]
  accounts: ["000000000000"]
